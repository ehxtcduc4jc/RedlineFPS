name: Build REDLINE FPS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          unzip -o RedlineFPS_Android_Project.zip
          cd RedlineFPS_Android_Project
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: REDLINE-FPS-APK
          path: RedlineFPS_Android_Project/app/build/outputs/apk/debug/app-debug.apk
